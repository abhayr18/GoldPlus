<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich metallic bullion gold gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#E5BE57" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="75%" stop-color="#A27918" />
      <stop offset="100%" stop-color="#735208" />
    </linearGradient>

    <!-- Deep obsidian app background gradient -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <!-- Subtle rim light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE57" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#A27918" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#735208" stop-opacity="0.4" />
    </linearGradient>

    <!-- Bullion bar top bevel gradient -->
    <linearGradient id="barFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE88F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- iOS / Android Squircle Base (22.5% radius) -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#appBg)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Inner subtle inset hairline -->
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- 3D Minted Bullion Ingot Geometry -->
  <g transform="translate(256, 256)">
    <!-- Base Bullion Outer Hex/Bevel Hallmark -->
    <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z"
          fill="none"
          stroke="url(#goldMetallic)"
          stroke-width="12"
          stroke-linejoin="round" />

    <!-- Inner Hallmark Ring -->
    <path d="M0 -126 L108 -63 L108 63 L0 126 L-108 63 L-108 -63 Z"
          fill="rgba(212, 175, 55, 0.06)"
          stroke="url(#goldMetallic)"
          stroke-width="3"
          stroke-dasharray="8 6"
          stroke-linejoin="round" />

    <!-- Center YASS Bullion Monogram (Geometric Y with Ingot Facets) -->
    <path d="M-60 -80 L-16 -80 L0 -44 L16 -80 L60 -80 L18 -10 L18 80 L-18 80 L-18 -10 Z"
          fill="url(#goldMetallic)" />

    <!-- 24K 999.9 Purity Hallmark Inscription -->
    <text x="0" y="106"
          text-anchor="middle"
          fill="#E5BE57"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Arial, sans-serif"
          font-size="20"
          font-weight="800"
          letter-spacing="4">
      999.9 FINE GOLD
    </text>

    <!-- Dubai Good Delivery Hallmark Stars -->
    <circle cx="-75" cy="0" r="4" fill="#E5BE57" />
    <circle cx="75" cy="0" r="4" fill="#E5BE57" />
  </g>
</svg>
